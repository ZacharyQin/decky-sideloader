name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy, rust-docs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: pnpm install --frozen-lockfile
      - name: Validate repository map
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/check-repository-map.py --base-ref "$BASE_REF"
      - name: Fetch locked Rust build dependencies
        run: cargo fetch --locked --manifest-path backend-rs/Cargo.toml
      - name: Verify application and fixtures
        env:
          SIDELOADER_E2E_REPORT: e2e-result.json
        run: |
          set -o pipefail
          pnpm test:all 2>&1 | tee e2e-result.log
      - name: Preserve fixture integration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-e2e-failure
          path: |
            e2e-result.log
            e2e-result.json
          if-no-files-found: ignore
      - name: Package plugin ZIP
        run: pnpm package-plugin
      - name: Validate release notes
        run: python3 -B scripts/release_notes.py --output dist/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: decky-sideloader
          path: dist/decky-sideloader-*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: decky-sideloader
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          python3 -B scripts/release_notes.py "$tag" --output release-notes.md
          gh release create "$tag" dist/decky-sideloader-*.zip --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file release-notes.md
